# 快速跳转：按 g 后再按对应按键。
[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "前往主目录"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "前往配置目录"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Downloads"
desc = "前往下载目录"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/work"
desc = "前往工作目录"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Desktop"
desc = "前往桌面"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd /tmp"
desc = "前往临时目录"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.local/share/chezmoi"
desc = "前往 dotfiles 仓库"
